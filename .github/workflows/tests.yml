name: tests

# 这个仓库已停止维护，工作流保留但只允许手动运行。
# 这样不会再有任何自动化触发，也就不会有 CI 相关的邮件通知。
# 想恢复自动跑，把下面换成 push/pull_request 即可。
on:
  workflow_dispatch:

jobs:
  test:
    name: py${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      # Windows runner 的控制台默认不是 UTF-8，中文断言消息会变成
      # UnicodeEncodeError 把真正的失败信息盖掉
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pillow numpy

      # 按文件拆开跑：CI 上挂了能直接从 step 名字看出是哪个文件
      - name: 跑测试 · 牌表示与向听
        if: always()
        run: python -m pytest tests/test_shanten.py -q
      - name: 跑测试 · 番种与算分
        if: always()
        run: python -m pytest tests/test_score.py -q
      - name: 跑测试 · 概率与期望
        if: always()
        run: python -m pytest tests/test_probability_ev.py -q
      - name: 跑测试 · 引擎与接口
        if: always()
        run: python -m pytest tests/test_engine_api.py -q
      - name: 跑测试 · 截图识别
        if: always()
        run: python -m pytest tests/test_vision.py -q
      - name: 跑测试 · 桌面版
        if: always()
        run: python -m pytest tests/test_desktop.py -q

      # 内核本身必须零依赖，单独验一次
      - name: 验证内核不依赖第三方包
        if: always()
        shell: bash
        run: |
          python -c 'import sys; from mahjong_kernel import Engine; r = Engine().analyze({"hand": "123m456p789s11z235m", "turn": 5}); bad = [m for m in ("numpy", "PIL", "cv2") if m in sys.modules]; print("shanten =", r["shanten"], "| 第三方模块 =", bad); assert r["shanten"] == 0, "向听算错了"; assert not bad, "内核竟然 import 了第三方包: %r" % bad'

  cli-smoke:
    name: CLI / HTTP 冒烟
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 命令行
        shell: bash
        run: |
          python -m mahjong_kernel.api.cli analyze "123m456p789s11z235m" --turn 5 --wall 60
          python -m mahjong_kernel.api.cli score "123m456p789s111z22z" --win 2z
          python -m mahjong_kernel.api.cli equations > equations.txt
          head -5 equations.txt
      - name: 方程对照表必须正好 45 条
        run: |
          python -m mahjong_kernel.api.cli equations --json > eq.json
          python -c "import json; d = json.load(open('eq.json', encoding='utf-8')); assert len(d) == 45, len(d); print('45 equations OK')"
